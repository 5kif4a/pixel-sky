<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#101c24" />
    <link rel="icon" href="data:," />
    <title>Pixel Sky</title>
  </head>
  <body>
    <div id="game"></div>
    <div id="vignette"></div>
    <div id="markers"></div>
    <header>
      <div class="mission">
        <i></i> <span data-i18n="ui.operation"></span
        ><small id="objectives" data-i18n="ui.objectives"></small>
      </div>
      <div class="header-buttons">
        <label class="audio-volume">
          <span id="volume-label" data-i18n="ui.volume"></span>
          <input
            id="volume"
            type="range"
            min="0"
            max="100"
            step="1"
            value="55"
            aria-labelledby="volume-label"
          />
        </label>
        <div id="lang" class="lang">
          <button data-lang="en" title="English">
            <svg viewBox="0 0 60 30" aria-hidden="true">
              <clipPath id="uk-t"><path d="M30 15h30v15zv15H0zH0V0zV0h30z" /></clipPath>
              <path d="M0 0v30h60V0z" fill="#012169" />
              <path d="M0 0l60 30m0-30L0 30" stroke="#fff" stroke-width="6" />
              <path
                d="M0 0l60 30m0-30L0 30"
                clip-path="url(#uk-t)"
                stroke="#c8102e"
                stroke-width="4"
              />
              <path d="M30 0v30M0 15h60" stroke="#fff" stroke-width="10" />
              <path d="M30 0v30M0 15h60" stroke="#c8102e" stroke-width="6" />
            </svg></button
          ><button data-lang="ru" title="Русский">
            <svg viewBox="0 0 9 6" aria-hidden="true">
              <path fill="#fff" d="M0 0h9v2H0z" />
              <path fill="#0039a6" d="M0 2h9v2H0z" />
              <path fill="#d52b1e" d="M0 4h9v2H0z" />
            </svg>
          </button>
        </div>
        <button id="pause" data-i18n="ui.pause"></button>
      </div>
    </header>
    <section id="hud" hidden>
      <div class="hud-left flight-readout">
        <div class="readout-line">
          <span data-i18n="hud.readoutIas"></span> <b id="ias">0</b>
          <span data-i18n="hud.speedUnit"></span>
        </div>
        <div class="readout-line">
          <span data-i18n="hud.readoutThrottle"></span> <b id="throttle">0%</b>
        </div>
        <div class="readout-line">
          <span data-i18n="hud.readoutAltitude"></span> <b id="altitude">0</b>
          <span data-i18n="hud.altitudeUnit"></span>
        </div>
        <div class="readout-line">
          <span data-i18n="hud.readoutGun"></span> <span id="gun-name"></span> <b id="gun">0</b>
        </div>
        <div class="readout-line" data-slot="missile">
          <span data-i18n="hud.readoutMissiles"></span> <span id="missile-name"></span>
          <b id="missiles">0</b>
        </div>
        <div class="readout-line">
          <span data-i18n="hud.readoutFuel"></span> <b id="endurance">0</b>
        </div>
        <div class="readout-line"><span data-i18n="ui.flares"></span> <b id="flares">0</b></div>
        <div id="config"></div>
      </div>
      <div class="g-status"><span data-i18n="hud.readoutLoad"></span> <span id="load"></span></div>
      <div class="damage">
        <canvas id="schematic"></canvas>
      </div>
      <div id="warnings"></div>
      <div id="messages"></div>
      <footer>
        <span data-i18n-html="ui.keysLeft"></span><span data-i18n-html="ui.keysRight"></span>
      </footer>
    </section>
    <div id="overlay">
      <canvas id="hangar-view"></canvas>
      <div class="aircraft-picker" id="aircraft-picker"></div>
      <div class="hangar-specs panel" id="hangar-specs"></div>
      <div class="launch">
        <button id="start" class="primary" data-i18n="ui.fly"></button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
